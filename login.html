<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in - PaperLens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <aside class="auth-aside">
        <div class="auth-topline">
          <a class="brand" href="index.html">
            <span class="brand-mark">CS</span>
            <span>PaperLens</span>
          </a>
          <a class="home-link" href="index.html">Home</a>
        </div>
        <div class="auth-copy">
          <h1>Welcome back.</h1>
          <p>Log in with your email and password to continue your CAIE Computer Science checklist work.</p>
        </div>
      </aside>

      <section class="auth-main" aria-label="Log in">
        <div class="auth-card">
          <h2>Log in</h2>
          <p>Enter your email first. If the account exists, you can continue with your password.</p>

          <form class="auth-form" id="loginForm">
            <div class="auth-step" id="loginEmailStep">
              <label>
                Email
                <input id="loginEmail" name="email" type="email" autocomplete="email" required />
              </label>
              <button class="auth-button" type="button" id="checkLoginEmailButton">Continue</button>
            </div>
            <div class="auth-step" id="loginPasswordStep" hidden>
              <label>
                Password
                <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
              </label>
              <div class="auth-actions">
                <button class="auth-button secondary" type="button" data-back-to="loginEmailStep">Back</button>
                <button class="auth-button" type="submit">Log in</button>
              </div>
            </div>
          </form>

          <p class="auth-message" id="authMessage" aria-live="polite"></p>
          <p class="auth-switch">New to PaperLens? <a href="signup.html">Sign up</a></p>
        </div>
      </section>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
