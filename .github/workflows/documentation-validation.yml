name: Documentation validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run documentation validator tests
        run: npm run test:documentation-validation

      - name: Run full documentation validation
        run: npm run validate:docs

      - name: Run changed-document validation
        if: github.event_name == 'pull_request'
        run: npm run validate:docs:changed -- --base "${{ github.event.pull_request.base.sha }}"

      - name: Run project test entrypoint
        run: npm test
